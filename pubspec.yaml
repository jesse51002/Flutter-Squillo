name: squillo
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dio: ^5.7.0
  get_it: ^8.0.2
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/squillo_mascot/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/Nunito/static/Nunito-Light.ttf
          weight: 300
        - asset: assets/Nunito/static/Nunito-Regular.ttf
          weight: 400
